# Local development database for the WPistic control plane.
# Usage: docker compose up -d, then `npm run db:migrate && npm run db:seed`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: wpistic-postgres
    environment:
      POSTGRES_USER: wpistic
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wpistic
    ports:
      - "5432:5432"
    volumes:
      - wpistic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpistic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wpistic_pgdata:
