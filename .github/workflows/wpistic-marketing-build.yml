name: wpistic-marketing build

on:
  push:
    paths:
      - 'wpistic-marketing/**'
      - '.github/workflows/wpistic-marketing-build.yml'
  pull_request:
    paths:
      - 'wpistic-marketing/**'
      - '.github/workflows/wpistic-marketing-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wpistic-marketing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wpistic-marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static export gate
        run: npm run check:static
